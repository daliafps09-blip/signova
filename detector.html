<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignovaLab - Detector</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #121212; color: #FFFFFF; min-height: 100vh; display: flex; flex-direction: column; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #1E1E24; border-bottom: 1px solid #2A2A35; }
    .logo { font-size: 1.25rem; font-weight: 700; color: #00E5FF; }
    .nav-links { display: flex; gap: 20px; }
    .nav-links a { color: #A0A0AB; text-decoration: none; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: #00E5FF; }
    
    .app-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px; }
    .main-wrapper { display: flex; flex-direction: row; background-color: #1E1E24; border: 1px solid #2A2A35; border-radius: 20px; padding: 30px; gap: 30px; max-width: 960px; width: 100%; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); }
    .left-column { flex: 1.2; display: flex; flex-direction: column; align-items: center; }
    .app-title { font-size: 1.25rem; font-weight: 700; color: #00E5FF; margin-bottom: 15px; text-align: center; }
    .controls-row { display: flex; gap: 10px; width: 100%; margin-bottom: 15px; }
    .btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s ease; }
    .btn-cam { background-color: #7C4DFF; color: #FFFFFF; }
    .btn-cam:hover { background-color: #6538E0; }
    .btn-upload { background-color: #2A2A35; color: #00E5FF; border: 1px solid #00E5FF; }
    .btn-upload:hover { background-color: #00E5FF; color: #121212; }
    .media-box { width: 100%; height: 260px; background-color: #121212; border: 2px dashed #2A2A35; border-radius: 12px; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
    #webcam-video, #image-preview { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
    .upload-placeholder { text-align: center; padding: 20px; color: #A0A0AB; cursor: pointer; }
    .upload-placeholder span { color: #00E5FF; font-weight: 600; display: block; margin-top: 6px; }
    input[type="file"] { display: none; }

    .right-column { flex: 1; background-color: #F8F9FA; color: #121212; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: inset 0 2px 8px rgba(0,0,0,0.05); }
    .stats-header-tag { font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; color: #6C757D; text-transform: uppercase; margin-bottom: 4px; }
    .stats-main-title { font-size: 1.8rem; font-weight: 800; color: #111111; margin-bottom: 24px; line-height: 1.1; }
    .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #E5E5E5; }
    .stat-label { font-size: 0.9rem; color: #495057; font-weight: 500; }
    .stat-value { font-size: 1.1rem; font-weight: 700; color: #111111; }
    .stat-value.highlight { color: #7C4DFF; }

    @media (max-width: 768px) { .main-wrapper { flex-direction: column; } nav { padding: 15px 20px; } }
  </style>
</head>
<body>
  <nav>
    <div class="logo">SignovaLab</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="detector.html" class="active">Detector</a>
      <a href="how-it-works.html">How It Works</a>
      <a href="about.html">About</a>
    </div>
  </nav>

  <div class="app-container">
    <div class="main-wrapper">
      <div class="left-column">
        <div class="app-title">Gesture Detector</div>
        <div class="controls-row">
          <button class="btn btn-cam" id="toggle-cam-btn">Start Camera</button>
          <button class="btn btn-upload" onclick="document.getElementById('file-input').click()">Upload Image</button>
          <input type="file" id="file-input" accept="image/*">
        </div>
        <div class="media-box" id="media-container">
          <video id="webcam-video" autoplay playsinline muted style="display: none;"></video>
          <div class="upload-placeholder" id="upload-prompt" onclick="document.getElementById('file-input').click()">
            <svg width="32" height="32" fill="none" stroke="#00E5FF" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span>Click to upload or start camera</span>
          </div>
          <img id="image-preview" style="display: none;" alt="Preview" />
        </div>
      </div>

      <div class="right-column">
        <div>
          <div class="stats-header-tag">Real-Time Stats</div>
          <div class="stats-main-title">System Output</div>
          <div class="stat-row">
            <span class="stat-label">Detected Gesture</span>
            <span class="stat-value highlight" id="out-gesture">Awaiting Input</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Confidence Score</span>
            <span class="stat-value" id="out-confidence">0.0%</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Frame Latency</span>
            <span class="stat-value" id="out-latency">-- ms</span>
          </div>
        </div>
        <div class="stat-row" style="border-bottom: none; padding-top: 16px;">
          <span class="stat-label">Engine Status</span>
          <span class="stat-value" style="color: #00C853;" id="out-status">Initializing...</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/ae8QMmd8K/";
    let model, maxPredictions;
    let mediaStream = null;
    let isPredictingActive = false;

    async function initModel() {
      try {
        const modelURL = MODEL_URL + "model.json";
        const metadataURL = MODEL_URL + "metadata.json";
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();
        document.getElementById("out-status").innerText = "Optimized";
      } catch (err) {
        document.getElementById("out-status").innerText = "Model Error";
        console.error(err);
      }
    }
    initModel();

    const videoElement = document.getElementById("webcam-video");
    const toggleCamBtn = document.getElementById("toggle-cam-btn");
    const uploadPrompt = document.getElementById("upload-prompt");
    const imagePreview = document.getElementById("image-preview");

    toggleCamBtn.addEventListener("click", async () => {
      if (mediaStream) {
        stopCamera();
        return;
      }
      try {
        uploadPrompt.style.display = "none";
        imagePreview.style.display = "none";
        videoElement.style.display = "block";
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        videoElement.srcObject = mediaStream;
        toggleCamBtn.innerText = "Stop Camera";
        toggleCamBtn.style.backgroundColor = "#D32F2F";
        if (!model) await initModel();
        isPredictingActive = true;
        predictLoop();
      } catch (err) {
        alert("Camera access blocked. Please check browser permissions.");
        console.error(err);
        stopCamera();
      }
    });

    function stopCamera() {
      isPredictingActive = false;
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      videoElement.style.display = "none";
      uploadPrompt.style.display = "block";
      toggleCamBtn.innerText = "Start Camera";
      toggleCamBtn.style.backgroundColor = "#7C4DFF";
    }

    async function predictLoop() {
      if (!isPredictingActive || !mediaStream) return;
      const startTime = performance.now();
      try {
        const prediction = await model.predict(videoElement);
        let top = prediction[0];
        for (let i = 1; i < maxPredictions; i++) {
          if (prediction[i].probability > top.probability) top = prediction[i];
        }
        const latency = (performance.now() - startTime).toFixed(1);
        const confidence = (top.probability * 100).toFixed(1);
        document.getElementById("out-gesture").innerText = top.className;
        document.getElementById("out-confidence").innerText = `${confidence}%`;
        document.getElementById("out-latency").innerText = `${latency}ms`;
      } catch (e) { console.error(e); }
      if (isPredictingActive) requestAnimationFrame(predictLoop);
    }

    document.getElementById("file-input").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      if (mediaStream) stopCamera();
      imagePreview.src = URL.createObjectURL(file);
      imagePreview.style.display = "block";
      uploadPrompt.style.display = "none";
      document.getElementById("out-gesture").innerText = "Analyzing...";

      imagePreview.onload = async function() {
        if (!model) await initModel();
        const startTime = performance.now();
        await imagePreview.decode();
        const prediction = await model.predict(imagePreview);
        let top = prediction[0];
        for (let i = 1; i < maxPredictions; i++) {
          if (prediction[i].probability > top.probability) top = prediction[i];
        }
        const latency = (performance.now() - startTime).toFixed(1);
        const confidence = (top.probability * 100).toFixed(1);
        document.getElementById("out-gesture").innerText = top.className;
        document.getElementById("out-confidence").innerText = `${confidence}%`;
        document.getElementById("out-latency").innerText = `${latency}ms`;
      };
    });
  </script>
</body>
</html>
