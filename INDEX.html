<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignovaLab - Home</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #121212; color: #FFFFFF; min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Navigation Bar */
    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #1E1E24; border-bottom: 1px solid #2A2A35; }
    .logo { font-size: 1.25rem; font-weight: 700; color: #00E5FF; }
    .nav-links { display: flex; gap: 20px; }
    .nav-links a { color: #A0A0AB; text-decoration: none; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: #00E5FF; }
    
    /* Hero Section */
    .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px 20px; max-width: 800px; margin: 0 auto; }
    
    .main-title-tag {
      font-size: 4rem;
      font-weight: 900;
      color: #00E5FF;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    h1 { 
      font-size: 2.2rem; 
      font-weight: 800; 
      margin-bottom: 20px; 
      color: #FFFFFF; 
    }
    
    h1 span { 
      color: #00E5FF; 
    }

    p { 
      color: #A0A0AB; 
      font-size: 1.1rem; 
      line-height: 1.6; 
      margin-bottom: 30px; 
    }

    .btn-primary { 
      background-color: #00E5FF; 
      color: #121212; 
      padding: 14px 28px; 
      border-radius: 8px; 
      font-weight: 700; 
      text-decoration: none; 
      transition: transform 0.2s; 
    }
    
    .btn-primary:hover { 
      transform: scale(1.05); 
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">SignovaLab</div>
    <div class="nav-links">
      <a href="index.html" class="active">Home</a>
      <a href="detector.html">Detector</a>
      <a href="how-it-works.html">How It Works</a>
      <a href="about.html">About</a>
    </div>
  </nav>

  <div class="hero">
    <div class="main-title-tag">SignovaLab</div>
    <h1>Bridging Communication Through <span>AI</span></h1>
    <p>Instantly translate sign language into clear, readable text, empowering inclusion and breaking down communication barriers one gesture at a time.</p>
    <a href="detector.html" class="btn-primary">Launch Detector App</a>
  </div>
</body>
</html>
